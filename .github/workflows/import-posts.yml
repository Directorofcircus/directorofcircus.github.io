name: Перенос постов из Telegram

on:
  repository_dispatch:
    types: [telegram-post]      # сигнал от бота: в канале вышел или изменился пост
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска
  schedule:
    - cron: '17 3 * * *'        # запасная проверка раз в сутки

concurrency:
  group: import-posts
  cancel-in-progress: false     # сигналы встают в очередь, ни один пост не теряется

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Библиотеки
        run: pip install requests beautifulsoup4 pillow numpy onnxruntime

      - name: Перенос
        env:
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
        run: python scripts/import_posts.py

      - name: Публикация на сайте
        run: |
          git config user.name "circus-bot"
          git config user.email "circus-bot@users.noreply.github.com"
          git add -A data js assets
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Новые посты из Telegram"
            git pull --rebase
            git push
          fi
